<div class="login-container">

  <div class="header">
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" fill="#042C53"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#042C53" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>Bienvenido</h2>
    <p>Ingresá tus credenciales para continuar</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" formControlName="username" placeholder="Ingresá tu usuario">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" formControlName="password" placeholder="Mínimo 8 caracteres">
      @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
        <small>La contraseña debe tener al menos 8 caracteres.</small>
      }
    </div>

    <div class="remember-row">
      <div class="remember-me">
        <input type="checkbox" id="rememberMe" (change)="rememberMe = !rememberMe">
        <label for="rememberMe">Recordarme</label>
      </div>
      <a class="forgot-link" (click)="goToForgotPassword()">¿Olvidaste tu contraseña?</a>
    </div>

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    <button type="submit" [disabled]="!loginForm.valid">
  Ingresar
</button>

  </form>

</div>
